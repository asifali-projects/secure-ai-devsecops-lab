services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: secure-ai-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://app:app_password@postgres:5432/securitylab
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine

    container_name: secure-ai-postgres

    environment:
      POSTGRES_DB: securitylab
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: secure-ai-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
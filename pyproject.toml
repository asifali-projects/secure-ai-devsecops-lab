[project]
name = "secure-ai-devsecops-lab"
version = "0.1.0"
description = "DevSecOps and AI Security Lab"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"